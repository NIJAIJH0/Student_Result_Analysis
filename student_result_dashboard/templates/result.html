<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Result Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">📈 Student Result Summary</h2>

        <div class="card p-4 shadow-sm mb-4">
            <p><strong>Topper:</strong> {{ topper }}</p>
            <p><strong>Average Score:</strong> {{ avg_score }}</p>
            <p><strong>Pass Percentage:</strong> {{ pass_percent }}%</p>
        </div>

        <div class="card p-4 shadow-sm mb-4">
            <h4 class="mb-3">Detailed Results</h4>
            <div class="table-responsive">
                {{ table | safe }}
            </div>
        </div>

        <div class="card p-4 shadow-sm text-center mb-4">
            <h4 class="mb-3">Average Marks by Subject</h4>
            <img src="{{ url_for('static', filename=chart_file) }}" class="img-fluid" alt="Chart">
        </div>

        <form action="{{ url_for('download_excel') }}" method="POST" class="text-center mt-3 mb-2">
    <input type="hidden" name="file_name" value="{{ excel_file }}">
    <button type="submit" class="btn btn-success">⬇ Download Excel</button>
</form>



        <form action="{{ url_for('download_pdf') }}" method="POST" class="text-center mt-3 mb-2">
    <input type="hidden" name="file_name" value="{{ excel_file }}">
    <input type="hidden" name="chart_name" value="{{ chart_file }}">  <!-- important -->
    <button type="submit" class="btn btn-danger">⬇ Download PDF</button>
</form>





        <div class="text-center mb-5">
            <a href="{{ url_for('index') }}" class="btn btn-secondary">⬅ Back to Upload</a>
        </div>
    </div>
</body>
</html>
